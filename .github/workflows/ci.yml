name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build (renderer bundle + library)
        run: npm run build
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Doctor
        run: node dist/cli.js doctor
      - name: Integration test (record + software render, 640x360)
        run: npm run test:integration
      - name: npm pack --dry-run
        run: npm pack --dry-run --ignore-scripts
      - name: Tarball smoke test (install packed tarball, run + short render)
        run: scripts/smoke-tarball.sh

  bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Record a TypeScript scenario under Bun (no render)
        run: bun dist/cli.js run test/fixtures/tiny.scenario.ts --out out/bun --no-render
      - name: Validate under Bun
        run: bun dist/cli.js validate out/bun/tiny.openscreen
