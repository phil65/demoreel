# Keep GitHub Actions and npm dev dependencies up to date: one grouped PR per ecosystem per
# month, merged automatically by .github/workflows/dependabot-automerge.yml once CI passes.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: increase-if-necessary
    # These are bundled into the renderer together with the vendored OpenScreen sources:
    # take major versions only together with an OpenScreen update (see AGENTS.md).
    ignore:
      - dependency-name: "pixi.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pixi-filters"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mediabunny"
        update-types: ["version-update:semver-major"]
      - dependency-name: "web-demuxer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "motion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gif.js"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"
